<!doctype html>
<!--
  The link preview image (public/og.png, 1200 × 630), in Syntype Light, using
  the theme roles from src/themes/themes.css. scripts/og-image.mjs renders it
  (from scripts/og/, so the stylesheet path is relative to there);
  {{LANGUAGES}} becomes the number of languages.
-->
<html lang="en" data-syntype-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=block" />
<link rel="stylesheet" href="../../src/themes/themes.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  :root { transition: none; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: "IBM Plex Sans", sans-serif; position: relative; }
  .top { position: absolute; left: 72px; top: 62px; right: 72px; display: flex; align-items: flex-end; justify-content: space-between; }
  .logo { font: 700 84px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.03em; margin: 0; }
  .logo span { color: var(--primary); }
  .tagline { font-size: 32px; color: var(--muted-foreground); margin: 14px 0 0; }
  .facts { text-align: right; font-size: 22px; color: var(--muted-foreground); line-height: 1.5; }
  .facts b { color: var(--foreground); font-weight: 600; }
  .pane { position: absolute; left: 72px; right: 72px; top: 262px; height: 420px; background: var(--card); border: 2px solid var(--border); border-radius: 18px; overflow: hidden; box-shadow: 0 18px 50px color-mix(in srgb, var(--shadow-color) 8%, transparent); }
  .tabbar { height: 58px; background: var(--muted); border-bottom: 2px solid var(--border); display: flex; align-items: stretch; }
  .tab { display: flex; align-items: center; gap: 12px; padding: 0 28px; background: var(--card); border-right: 2px solid var(--border); font: 22px "JetBrains Mono", monospace; margin-bottom: -2px; }
  .tab i { width: 12px; height: 12px; border-radius: 3px; background: var(--tab-indicator); }
  pre { margin: 0; padding: 26px 0 0; display: flex; font: 26px/1.72 "JetBrains Mono", monospace; font-variant-ligatures: none; }
  .gutter { color: var(--muted-foreground); opacity: .55; text-align: right; padding: 0 22px 0 26px; }
  .gutter .now { color: var(--primary); opacity: 1; }
  .k { color: var(--code-keyword); } .s { color: var(--code-string); } .n { color: var(--code-number); } .f { color: var(--code-function); } .p { color: var(--code-punctuation); }
  .todo { opacity: .34; }
  .cur { box-shadow: inset 3px 0 0 var(--primary); background: var(--accent); opacity: .85; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1 class="logo">Syn<span>type</span></h1>
      <p class="tagline">Typing speed, measured in code</p>
    </div>
    <div class="facts"><b>{{LANGUAGES}} languages</b>, real snippets<br />VS Code-style autocomplete</div>
  </div>
  <div class="pane">
    <div class="tabbar"><div class="tab"><i></i>debounce.js</div></div>
    <pre><span class="gutter">1
2
3
<span class="now">4</span>
5
6</span><code><span class="k">function</span> <span class="f">debounce</span><span class="p">(</span>fn<span class="p">,</span> wait <span class="p">=</span> <span class="n">200</span><span class="p">)</span> <span class="p">{</span>
  <span class="k">let</span> timer<span class="p">;</span>
  <span class="k">return</span> <span class="p">(...</span>args<span class="p">)</span> <span class="p">=&gt;</span> <span class="p">{</span>
    <span class="f">clearTi</span><span class="cur"><span class="f">m</span></span><span class="todo"><span class="f">eout</span><span class="p">(</span>timer<span class="p">);</span></span>
<span class="todo">    timer <span class="p">=</span> <span class="f">setTimeout</span><span class="p">(()</span> <span class="p">=&gt;</span> <span class="f">fn</span><span class="p">(...</span>args<span class="p">),</span> wait<span class="p">);</span></span>
<span class="todo">  <span class="p">};</span></span></code></pre>
  </div>
</body>
</html>
